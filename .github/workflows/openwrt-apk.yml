name: OpenWrt APK build
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/openwrt-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file wget zstd
      - name: Download verified OpenWrt SDK
        run: |
          curl -fL --retry 3 -o sdk.tar.zst https://downloads.openwrt.org/releases/25.12.3/targets/ramips/mt7621/openwrt-sdk-25.12.3-ramips-mt7621_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          echo 'ffd84cbe13486bf00c7074a1d23ecec5c61b7996bcd91d7a27f7d9dfafeb6cc0  sdk.tar.zst' | sha256sum -c -
          mkdir sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1
      - name: Build packages
        run: sh build-sdk.sh "$GITHUB_WORKSPACE/sdk"
      - name: Collect packages and public verification key
        run: |
          mkdir artifacts
          find sdk/bin/packages -type f \( -name 'nimarkoflow-*.apk' -o -name 'luci-app-nimarkoflow-*.apk' \) -exec cp {} artifacts/ \;
          find sdk -maxdepth 1 -type f -name '*.pub' -exec cp {} artifacts/ \;
          test "$(find artifacts -name '*.apk' | wc -l)" -eq 2
          test "$(find artifacts -name '*.pub' | wc -l)" -ge 1
          cd artifacts
          sha256sum *.apk *.pub > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: NimarkoFlow-openwrt-25.12.3-mipsel_24kc
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
